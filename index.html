<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Security headers are set by the host (see vercel.json), not here.
      Browsers ignore X-Frame-Options, HSTS and X-XSS-Protection in
      <meta http-equiv>, so declaring them here did nothing. CSP is the one
      header that does work in a meta tag, and it is kept in sync with
      vercel.json so dev and production behave the same.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https://open.spotify.com; base-uri 'self'; form-action 'self'; object-src 'none'"
    />

    <title>Kinlo Ephriam Tangiri | Full-Stack Developer, AI/ML Focus</title>
    <meta
      name="description"
      content="Kinlo Ephriam Tangiri, Bremen. Full-stack developer focused on AI applications. BSc Computer Science, AI/ML specialization, thesis on LLM hallucination."
    />
    <meta name="author" content="Kinlo Ephriam Tangiri" />
    <meta name="theme-color" content="#141417" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kinlo Ephriam Tangiri" />
    <meta
      property="og:title"
      content="Kinlo Ephriam Tangiri | Full-Stack Developer, AI/ML Focus"
    />
    <meta
      property="og:description"
      content="Full-stack developer focused on AI applications. BSc in Computer Science with a Data Science minor and an AI/ML specialization, plus program and project management experience."
    />
    <meta property="og:image" content="https://kinloephraim.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kinlo Ephriam Tangiri, full-stack developer with an AI/ML focus"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Kinlo Ephriam Tangiri | Full-Stack Developer, AI/ML Focus"
    />
    <meta
      name="twitter:description"
      content="Full-stack developer focused on AI applications. BSc in Computer Science with a Data Science minor and an AI/ML specialization, plus program and project management experience."
    />
    <meta
      name="twitter:image"
      content="https://kinloephraim.com/og-image.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
